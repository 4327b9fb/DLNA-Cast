plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    namespace 'com.android.cast.dlna.transport.okhttp4'
    compileSdk 33
    defaultConfig {
        minSdk 24
        targetSdk 33
        consumerProguardFiles "consumer-rules.pro"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api(project(':dlna-core'))

    // OkHttp 4.x — supports Android API 21+, Kotlin-style API with extension functions
    api 'com.squareup.okhttp3:okhttp:4.12.0'

    // NanoHTTPD — lightweight HTTP server for UPnP StreamServer
    api 'org.nanohttpd:nanohttpd:2.3.1'
}

apply from: './publish.gradle'